<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ميزان الشمس</title>
<!-- ══════════════════════════════════════════════════════════════
     المكتبات الخارجية — v17.10
     ──────────────────────────────────────────────────────────────
     كانت خمسة سكربتات هنا تُعطّل تحليل الصفحة. دون تغطية شبكة
     ينتظر المتصفح انتهاء مهلة كلٍّ منها بالتتابع — قِسنا ٢٤ ثانية
     أمام شاشة فارغة قبل أن تظهر شاشة الدخول.
     الآن: Excel و PDF تُحمَّل عند الطلب فقط (عند التصدير)،
     وفايربيس تُحمّل نفسها ديناميكياً عبر _loadFirebaseDynamic
     مع خادم بديل. التطبيق يفتح فوراً دون انتظار أي منها.
══════════════════════════════════════════════════════════════ -->
<meta name="theme-color" content="#F7F8FA">
<!-- v17.21 — يمنع كروم من عرض شريط الإكمال (كلمة مرور/بطاقة/عنوان)
     فوق لوحة المفاتيح. لا توجد في التطبيق أي بيانات دخول أو دفع
     يريد المتصفح حفظها — كلها حقول تشغيلية. -->
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<!-- عند "إضافة إلى الشاشة الرئيسية" يعمل التطبيق بلا شريط متصفح إطلاقاً —
     ملء شاشة حقيقي دائم لا يحتاج F11 في كل مرة. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان الشمس">
<!-- ══════════════════════════════════════════════════════════════
     الخطوط — v17.10
     ──────────────────────────────────────────────────────────────
     كان <link rel="stylesheet"> يوقف رسم الصفحة حتى يصل رد الخادم.
     دون إنترنت (وهو الحال في الساحة) تبقى الشاشة بيضاء حتى تنتهي
     مهلة الاتصال. الآن يُحمَّل بـ media="print" فلا يُعطّل الرسم،
     ثم يُفعَّل عند وصوله. وإن لم يصل أبداً، يعمل التطبيق فوراً
     بخطوط النظام العربية المدمجة في الهاتف.
══════════════════════════════════════════════════════════════ -->
