<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0a09">
  <meta name="mobile-web-app-capable" content="yes">
  <title>تطبيق الموظفين — المنيو الضوئي</title>
  <!-- Cloud-mode copy of public/app/index.html, kept in sync by
       test/android-cloud-assets.test.js: the same stylesheets (absolute paths,
       as this page lives in /cloud/) plus the start-up states, the same import
       map plus the Socket.IO client swapped for the demo's and the Firebase SDK
       bundled in the APK (bare names for the backend, gstatic URLs for the SDK
       files' imports of each other), and frame-shim.js first so fetch / XHR
       can be handed to the cloud backend once app.js has started it. -->
  <script src="/demo/frame-shim.js"></script>
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/fonts.css">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/app/styles/tokens.css">
  <link rel="stylesheet" href="/app/styles/base.css">
  <link rel="stylesheet" href="/app/styles/components.css">
  <link rel="stylesheet" href="/app/styles/layout.css">
  <link rel="stylesheet" href="/app/styles/screens.css">
  <link rel="stylesheet" href="/app/styles/manage.css">
  <link rel="stylesheet" href="/cloud/boot.css">
  <script type="importmap">
    {
      "imports": {
        "preact": "/vendor/preact/dist/preact.module.js",
        "preact/hooks": "/vendor/preact/hooks/dist/hooks.module.js",
        "htm": "/vendor/htm/dist/htm.module.js",
        "htm/preact": "/vendor/htm/preact/index.module.js",
        "/socket.io/socket.io.esm.min.js": "/demo/fake-socket.js",
        "firebase/app": "/vendor/firebase/firebase-app.js",
        "firebase/auth": "/vendor/firebase/firebase-auth.js",
        "firebase/firestore": "/vendor/firebase/firebase-firestore.js",
        "firebase/storage": "/vendor/firebase/firebase-storage.js",
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js": "/vendor/firebase/firebase-app.js",
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js": "/vendor/firebase/firebase-auth.js",
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js": "/vendor/firebase/firebase-firestore.js",
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js": "/vendor/firebase/firebase-storage.js"
      }
    }
  </script>
</head>
<body>
  <div id="root">
    <!-- Shown until the app module paints. -->
    <div class="boot-splash" aria-busy="true">
      <div class="boot-mark"></div>
    </div>
  </div>
  <script type="module" src="/cloud/app.js"></script>
</body>
</html>
